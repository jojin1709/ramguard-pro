[package]
name = "ramguard-pro"
version = "0.1.0"
description = "RAMGuard Pro - Windows memory optimizer"
edition = "2021"
default-run = "ramguard-pro"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
once_cell = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_Security",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
